<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#8B5CF6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Frame -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="27" height="27" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Inner Dark Backdrop for Contrast -->
  <rect x="5" y="5" width="22" height="22" rx="6" fill="#0A0C14" fill-opacity="0.4" />

  <!-- Tasks / Checkmark Icon -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Task: Check + Line -->
    <path d="M8.5 11.5L10.5 13.5L14.5 9.5" stroke="#38BDF8" stroke-width="2.2" />
    <line x1="17.5" y1="11.5" x2="23.5" y2="11.5" stroke="#F1F5F9" />

    <!-- Bottom Task: Check + Line -->
    <path d="M8.5 19.5L10.5 21.5L14.5 17.5" stroke="#A78BFA" stroke-width="2.2" />
    <line x1="17.5" y1="19.5" x2="23.5" y2="19.5" stroke="#F1F5F9" />
  </g>
</svg>
